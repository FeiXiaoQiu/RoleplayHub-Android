name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          NOTES="$(git log "${PREV_TAG:+$PREV_TAG..}HEAD" --oneline --no-decorate)

          ### 版本说明
          本版本为 rc-14（213），沿用上游 1.9.6 Preview（c52ac9a）基线及 rc-13 图标。使用相同签名时可从 rc-13 及更早版本升级。

          - 点击导出数据直接执行含图片的完整备份，移除精简/完整二级选择，保留权限申请流程。
          - 返回键逐级关闭确认框、弹窗、侧栏、全屏、子页面；角色卡工坊和小说工具内部弹层优先返回。
          - 修复 JS 未就绪、异常或 Promise 被 evaluateJavascript 序列化后误判退出，以及退出分发后原生回调永久禁用的问题。
          - 仅 JS 明确报告根页面时回退 WebView 历史或退出；同步根 Web 与 APK 内置资源，版本递进至 2.0.0-rc-14 / 213。
          - 系统返回手势、覆盖升级和完整备份恢复仍需 Android 真机验收。

          ### rc-12 已有更新

          - 三方合并上游 1.9.6 Preview，保留 Android 套壳和本地定制。
          - 页面依赖保持本地 vendor 优先加载，保留侧边栏修复。
          - 补全 WebView HTML5 全屏与备份导出、恢复桥接。
          - 修复选择 1 张图片仍被强制改成 2 张的问题。
          - 新增默认开启的输入框回车换行开关，兼容中文输入法选字。
          - 修复退出全屏后的系统栏颜色恢复；打孔屏效果待真机验证。"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Roleplay Hub Android $TAG" \
            --verify-tag \
            --notes "$NOTES"
          fi

      - name: Build release APK
        working-directory: android-app
        run: gradle assembleRelease -x lintVitalRelease --no-daemon

      - name: Upload APK and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            android-app/app/build/outputs/apk/release/RoleplayHub-*.apk
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --draft=false
