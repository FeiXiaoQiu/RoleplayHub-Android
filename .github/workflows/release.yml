name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          NOTES="$(git log "${PREV_TAG:+$PREV_TAG..}HEAD" --oneline --no-decorate)

          ### 版本说明
          本版本为 rc-11（210），可从 rc-9（208）直接升级；仓库已有 rc-10 标签。

          - 页面依赖改为本地 vendor 优先加载，修复侧边栏不可用。
          - 补全 WebView HTML5 全屏与备份导出、恢复桥接。
          - 修复选择 1 张图片仍被强制改成 2 张的问题。
          - 新增默认开启的输入框回车换行开关，兼容中文输入法选字。
          - 修复退出全屏后的系统栏颜色恢复；打孔屏效果待真机验证。"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Roleplay Hub Android $TAG" \
            --verify-tag \
            --notes "$NOTES"
          fi

      - name: Build release APK
        working-directory: android-app
        run: gradle assembleRelease -x lintVitalRelease --no-daemon

      - name: Upload APK and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            android-app/app/build/outputs/apk/release/RoleplayHub-*.apk
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --draft=false
